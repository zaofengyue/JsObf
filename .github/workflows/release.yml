name: Release Pages Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Cloudflare Pages deployment files
        run: |
          mkdir -p dist/lib
          cp index.html styles.css app.js worker.js dist/
          cp lib/javascript-obfuscator.browser.js dist/lib/
          cd dist
          zip -r ../jsobf-pages.zip ./*
          cd ..
          ls -la jsobf-pages.zip

      - name: Determine Tag Name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          files: jsobf-pages.zip
          generate_release_notes: true
          draft: false
          prerelease: false
